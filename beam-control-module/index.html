<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beam Control — demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="beam-control.css">
  <style>
    body{ margin:0; background:#050505; }
    /* full-width opcional: el módulo ocupa todo el ancho del contenedor */
    #beam { width:100%; }
  </style>
</head>
<body>
  <!-- El módulo se monta acá. Nada de encabezados: solo el componente. -->
  <div id="beam"></div>

  <script src="beam-control.js"></script>
  <script>
    // Montaje explícito (recomendado). Ver README para el objeto de config.
    BeamControl(document.getElementById('beam'), {
      image: 'assets/sala-off.png',
      aspect: '1672 / 941'
      // sectors: [...]  // opcional: sobreescribe posiciones/ángulos
    });
  </script>
</body>
</html>
